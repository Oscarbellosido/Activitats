name: Prova fonts (temporal)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/prova/prova.sh > prova-fonts.txt 2>&1 || true
      - run: |
          git config user.name activitats-bot; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f prova-fonts.txt; git commit -m "Resultat prova"; git pull --rebase -q; git push
