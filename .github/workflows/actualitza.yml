name: Actualitza activitats

# Cada dia a partir de les 6:00 de Catalunya. GitHub només admet hores UTC (i Catalunya canvia d'hora a l'estiu i a
# l'hivern) i a més de vegades se salta execucions programades, sobretot a l'hora en punt. Per això es programa a
# diverses hores del matí amb minuts no rodons: l'script només actualitza si ja són les 6 a Catalunya i avui encara
# no s'ha fet, així que la primera que s'executi fa la feina i la resta no fan res.
on:
  schedule:
    - cron: '7 4 * * *'
    - cron: '13 5 * * *'
    - cron: '23 6 * * *'
    - cron: '37 7 * * *'
    - cron: '47 9 * * *'
    - cron: '53 13 * * *'
  workflow_dispatch:
    inputs:
      forca:
        description: "Actualitza encara que avui ja s'hagi fet"
        type: boolean
        default: true
      nomes:
        description: "Només aquesta font (generalitat, patrimoni, diba o guiabcn); buit = totes"
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: actualitza
  cancel-in-progress: false

jobs:
  actualitza:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Baixa i classifica les activitats
        run: node scripts/actualitza.mjs ${{ (github.event_name == 'workflow_dispatch' && inputs.forca) && '--forca' || '' }} ${{ inputs.nomes && format('--nomes {0}', inputs.nomes) || '' }}
      - name: Desa els canvis
        run: |
          git add data/activitats.json data/cache-patrimoni.json 2>/dev/null || git add data/activitats.json
          if git diff --cached --quiet; then echo "Sense canvis"; exit 0; fi
          git config user.name "activitats-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Activitats $(TZ=Europe/Madrid date +%Y-%m-%d)"
          git pull --rebase -q -X theirs || true
          git push
