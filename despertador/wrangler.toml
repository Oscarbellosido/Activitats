name = "activitats-despertador"
main = "worker.js"
compatibility_date = "2024-01-01"

[triggers]
# Hores UTC. 4:05 i 5:05 UTC = 6:05 i 7:05 a l'estiu, 5:05 i 6:05 a l'hivern.
# L'script de l'app ignora l'avís si encara no són les 6 a Catalunya o si avui ja s'ha actualitzat.
crons = ["5 4 * * *", "5 5 * * *"]
